[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Програма рахує відсотки й частки пулу. Тихе переповнення тут — це вкрадені гроші,
# тому перевірки лишаються увімкненими і в релізі.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
