[package]
name = "reward-float"
version = "0.1.0"
edition = "2021"
description = "Micro-loans to DePIN operators against future token rewards"

[lib]
crate-type = ["cdylib", "lib"]
name = "reward_float"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

[dev-dependencies]
# Плетіння акаунтів (сіди, делегування, CPI до токен-програми) перевіряє лише
# справжній рантайм. litesvm тут не збирається з anchor 0.32.1 (E0027 на touched_flags).
mollusk-svm = "0.15.0"
# Видача, погашення й утримання все переказують SPL-токени: без ELF токен-програми
# жодна з інструкцій не доходить до кінця.
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["token"] }
# Гілка типів у mollusk (agave 4.x) не та, у якій живе anchor-lang 0.32.1
# (solana-program 2.3). Це два різні Pubkey, міст між ними — to_bytes().
solana-account = "4.3"
solana-instruction = "3.4"
solana-pubkey = "4.2"
